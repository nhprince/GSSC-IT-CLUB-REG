name = "gssc-it-club"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding.
# Create the database first with:
#   npx wrangler d1 create gssc_it_club_db
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "gssc_it_club_db"
database_id = "71deda86-3622-41d9-88b1-b01f68d474f0"

# Confirmation emails are sent via the Resend API (see README.md — "Setting
# up confirmation emails"), not a Cloudflare binding, so no wrangler.toml
# entry is needed for it — just the RESEND_API_KEY secret:
#   npx wrangler pages secret put RESEND_API_KEY
